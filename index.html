<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio Pro</title>

<style>
  @keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.pop {
  animation: pop 0.3s ease;
}
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

header {
  background: #e63946;
  padding: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: #1c1c1c;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  background: #25d366;
  border: none;
  padding: 8px 10px;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.cart {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #111;
  padding: 15px;
  border-top: 2px solid #333;
}

.total {
  font-size: 18px;
  margin-bottom: 10px;
}

.finalizar {
  width: 100%;
  padding: 12px;
  background: #e63946;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>🍔 CARDÁPIO SIRI CASCUDO</header>
  <div class="card">
  <div>
    <b>X-Burger</b><br>
    R$ <span id="p1">12</span>
  </div>
  <button onclick="add('X-Burger',getPreco('p1'))">Adicionar</button>
</div>

<div class="card">
  <div>
    <b>X-Salada</b><br>
    R$ <span id="p2">14</span>
  </div>
  <button onclick="add('X-Salada',getPreco('p2'))">Adicionar</button>
</div>

<div class="card">
  <div>
    <b>Refrigerante</b><br>
    R$ <span id="p3">5</span>
  </div>
  <button onclick="add('Refrigerante',getPreco('p3'))">Adicionar</button>
</div>


<!-- CARRINHO -->
<div class="cart">
  <div class="total" id="total">Total: R$ 0</div>
  <button class="finalizar" onclick="finalizar()">Finalizar pedido no WhatsApp</button>
</div>

<script>
  function abrirPainel() {
  let senha = prompt("Digite a senha do admin:");

  if (senha === "1234") {
    document.getElementById("painel").style.display = "block";
  } else {
    alert("Senha incorreta ❌");
  }
}

function salvarPrecos() {
  document.getElementById("p1").innerText = document.getElementById("preco1").value;
  document.getElementById("p2").innerText = document.getElementById("preco2").value;
  document.getElementById("p3").innerText = document.getElementById("preco3").value;

  alert("Preços atualizados com sucesso ✔️");
}

function getPreco(id) {
  return parseFloat(document.getElementById(id).innerText);
}
let carrinho = [];

function add(nome, preco) {
  carrinho.push({nome, preco});
  atualizar();
}

function atualizar() {
  let total = carrinho.reduce((soma, item) => soma + item.preco, 0);
  document.getElementById("total").innerText = "Total: R$ " + total;
}

function finalizar() {
  let msg = "Olá! Quero fazer um pedido:%0A";

  carrinho.forEach(i => {
    msg += "- " + i.nome + " R$ " + i.preco + "%0A";
  });

  let total = carrinho.reduce((soma, item) => soma + item.preco, 0);
  msg += "%0ATotal: R$ " + total;

  window.open("https://wa.me/5511953577785?text=" + msg);
}
</script>
  
  <div style="text-align:center; padding:10px;">
  <button onclick="abrirPainel()">🔧 Painel Admin</button>
</div>

<div id="painel" style="display:none; background:#222; padding:15px; margin:10px; border-radius:10px; max-width:400px; margin:auto;">
  <h3>Painel de Preços</h3>

  <label>X-Burger:</label>
  <input type="number" id="preco1" value="12"><br><br>

  <label>X-Salada:</label>
  <input type="number" id="preco2" value="14"><br><br>

  <label>Refrigerante:</label>
  <input type="number" id="preco3" value="5"><br><br>

  <button onclick="salvarPrecos()">💾 Salvar</button>
</div>
</html
