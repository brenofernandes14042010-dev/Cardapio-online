<!DOCTYPE html><html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Loja de Sites PRO</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#111;color:#fff;padding:20px;text-align:center}
.container{display:flex;gap:20px;padding:20px}
.box{background:#fff;padding:15px;border-radius:10px}
.products{flex:2}
.cart{flex:1}
button{padding:8px;background:black;color:white;border:none;cursor:pointer;margin-top:5px}
input{display:block;margin:5px 0;padding:8px;width:100%}
.hidden{display:none}
</style>
</head>
<body><header>
<h1>🚀 Loja de Sites PRO</h1>
</header><!-- LOGIN AREA --><div class="box" style="margin:20px">
<h2>🔐 Login do Sistema</h2>
<input id="loginUser" placeholder="Usuário">
<input id="loginPass" type="password" placeholder="Senha">
<button onclick="login()">Entrar</button>
<p id="loginMsg"></p>
</div><div id="app" class="hidden"><div class="container"><!-- PRODUTOS --><div class="box products">
<h2>🛍️ Produtos</h2>
<div id="products"></div>
</div><!-- CARRINHO --><div class="box cart">
<h2>🛒 Carrinho</h2>
<div id="cart"></div>
<h3>Total: R$ <span id="total">0</span></h3>
<button onclick="checkout()">Finalizar WhatsApp</button>
</div></div><!-- ADMIN --><div class="box" style="margin:20px">
<h2>⚙️ Painel Admin</h2><input type="password" id="pass" placeholder="Senha admin">
<button onclick="adminLogin()">Entrar Admin</button><div id="admin" class="hidden" style="margin-top:10px"><input id="name" placeholder="Nome do site">
<input id="price" placeholder="Preço">
<button onclick="addProduct()">Adicionar</button><h3>Gerenciar Produtos</h3>
<div id="manage"></div></div>
</div></div><script>

// ===== USERS =====
const users = [
  {user:"cliente", pass:"123"},
  {user:"breno", pass:"123"}
];

// ===== ADMIN =====
const ADMIN_PASS = "1234";

let products = JSON.parse(localStorage.getItem("products")) || [
  {name:"Site Cardápio",price:99},
  {name:"Site Loja",price:149},
  {name:"Site Empresarial",price:199}
];

let cart = [];

function login(){
  const u=document.getElementById("loginUser").value;
  const p=document.getElementById("loginPass").value;

  const found = users.find(x=>x.user===u && x.pass===p);

  if(found){
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("loginMsg").innerText="Login OK";
    renderProducts();
  }else{
    document.getElementById("loginMsg").innerText="Login inválido";
  }
}

function adminLogin(){
  let pass=document.getElementById("pass").value;
  if(pass===ADMIN_PASS){
    document.getElementById("admin").classList.remove("hidden");
  }else{
    alert("Senha admin errada");
  }
}

function renderProducts(){
  let div=document.getElementById("products");
  div.innerHTML="";
  products.forEach((p,i)=>{
    div.innerHTML+=`
      <p><b>${p.name}</b> - R$ ${p.price}
      <button onclick="add(${i})">Adicionar</button></p>
    `;
  });
  renderManage();
}

function renderManage(){
  let div=document.getElementById("manage");
  div.innerHTML="";
  products.forEach((p,i)=>{
    div.innerHTML+=`
      <p>${p.name} - R$ ${p.price}
      <button onclick="del(${i})">X</button></p>
    `;
  });
}

function add(i){
  cart.push(products[i]);
  renderCart();
}

function renderCart(){
  let div=document.getElementById("cart");
  div.innerHTML="";
  let total=0;

  cart.forEach((c,i)=>{
    total+=c.price;
    div.innerHTML+=`
      <p>${c.name} <button onclick="remove(${i})">X</button></p>
    `;
  });

  document.getElementById("total").innerText=total;
}

function remove(i){cart.splice(i,1);renderCart();}

function checkout(){
  let msg="Pedido:%0A";
  let total=0;

  cart.forEach(c=>{
    msg+=`- ${c.name} R$${c.price}%0A`;
    total+=c.price;
  });

  msg+=`%0ATotal: R$${total}`;

  window.open("https://wa.me/5511953577785?text="+msg);
}

function addProduct(){
  let name=document.getElementById("name").value;
  let price=Number(document.getElementById("price").value);

  products.push({name,price});
  localStorage.setItem("products",JSON.stringify(products));
  renderProducts();
}

function del(i){
  products.splice(i,1);
  localStorage.setItem("products",JSON.stringify(products));
  renderProducts();
}

</script></body>
</html>
<!DOCTYPE html><html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Loja de Sites PRO</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#111;color:#fff;padding:20px;text-align:center}
.container{display:flex;gap:20px;padding:20px}
.box{background:#fff;padding:15px;border-radius:10px}
.products{flex:2}
.cart{flex:1}
button{padding:8px;background:black;color:white;border:none;cursor:pointer;margin-top:5px}
input{display:block;margin:5px 0;padding:8px;width:100%}
.hidden{display:none}
a{color:blue;cursor:pointer}
</style>
</head>
<body><header>
<h1>🚀 Loja de Sites PRO</h1>
<p><a onclick="goStore()">Loja</a> | <a onclick="goAdmin()">Admin</a></p>
</header><!-- LOGIN --><div id="loginBox" class="box" style="margin:20px">
<h2>🔐 Login</h2>
<input id="loginUser" placeholder="Usuário">
<input id="loginPass" type="password" placeholder="Senha">
<button onclick="login()">Entrar</button>
<p id="msg"></p>
</div><!-- LOJA --><div id="store" class="hidden">
<div class="container"><div class="box products">
<h2>🛍️ Produtos</h2>
<div id="products"></div>
</div><div class="box cart">
<h2>🛒 Carrinho</h2>
<div id="cart"></div>
<h3>Total: R$ <span id="total">0</span></h3>
<button onclick="checkout()">Finalizar WhatsApp</button>
</div></div>
</div><!-- ADMIN (SEPARADO MAS NO MESMO ARQUIVO) --><div id="admin" class="hidden">
<div class="box" style="margin:20px">
<h2>⚙️ Painel Admin</h2><input type="password" id="adminPass" placeholder="Senha admin">
<button onclick="adminLogin()">Entrar Admin</button><div id="adminPanel" class="hidden">
<input id="name" placeholder="Nome do site">
<input id="price" placeholder="Preço">
<button onclick="addProduct()">Adicionar</button><h3>Produtos</h3>
<div id="manage"></div>
</div>
</div>
</div><script>

const ADMIN_PASS = "1234";

let products = JSON.parse(localStorage.getItem("products")) || [
  {name:"Site Cardápio",price:99},
  {name:"Site Loja",price:149},
  {name:"Site Empresarial",price:199}
];

let cart = [];

function goAdmin(){ location.hash = "admin"; renderRoute(); }
function goStore(){ location.hash = "store"; renderRoute(); }

function renderRoute(){
  document.getElementById("store").classList.add("hidden");
  document.getElementById("admin").classList.add("hidden");
  document.getElementById("loginBox").classList.add("hidden");

  if(location.hash === "#admin"){
    document.getElementById("admin").classList.remove("hidden");
  }else{
    document.getElementById("store").classList.remove("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
  }
}

window.onhashchange = renderRoute;

function login(){
  let u=document.getElementById("loginUser").value;
  let p=document.getElementById("loginPass").value;

  if(u && p){
    document.getElementById("store").classList.remove("hidden");
    document.getElementById("loginBox").classList.add("hidden");
    renderProducts();
  }else{
    document.getElementById("msg").innerText="Login inválido";
  }
}

function adminLogin(){
  let p=document.getElementById("adminPass").value;
  if(p===ADMIN_PASS){
    document.getElementById("adminPanel").classList.remove("hidden");
  }else alert("Senha errada");
}

function renderProducts(){
  let div=document.getElementById("products");
  if(!div) return;

  div.innerHTML="";
  products.forEach((p,i)=>{
    div.innerHTML+=`<p><b>${p.name}</b> - R$ ${p.price}
    <button onclick="add(${i})">Adicionar</button></p>`;
  });

  renderManage();
}

function renderManage(){
  let div=document.getElementById("manage");
  if(!div) return;

  div.innerHTML="";
  products.forEach((p,i)=>{
    div.innerHTML+=`<p>${p.name} - R$ ${p.price}
    <button onclick="del(${i})">X</button></p>`;
  });
}

function add(i){
  cart.push(products[i]);
  renderCart();
}

function renderCart(){
  let div=document.getElementById("cart");
  if(!div) return;

  div.innerHTML="";
  let total=0;

  cart.forEach((c,i)=>{
    total+=c.price;
    div.innerHTML+=`<p>${c.name} <button onclick="remove(${i})">X</button></p>`;
  });

  document.getElementById("total").innerText=total;
}

function remove(i){ cart.splice(i,1); renderCart(); }

function checkout(){
  let msg="Pedido:%0A";
  let total=0;

  cart.forEach(c=>{
    msg+=`- ${c.name} R$${c.price}%0A`;
    total+=c.price;
  });

  msg+=`%0ATotal: R$${total}`;
  window.open("https://wa.me/5511999999999?text="+msg);
}

function addProduct(){
  let n=document.getElementById("name").value;
  let p=Number(document.getElementById("price").value);

  products.push({name:n,price:p});
  localStorage.setItem("products",JSON.stringify(products));
  renderProducts();
}

function del(i){
  products.splice(i,1);
  localStorage.setItem("products",JSON.stringify(products));
  renderProducts();
}

renderRoute();
renderProducts();

</script></body>
</html>
